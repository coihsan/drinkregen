name: Deploy Astro Site to GitHub Pages

on:
  push:
    branches: [ main ] # ganti dengan 'master' jika branch utama kamu bernama master

# Mengizinkan action untuk membaca repo dan men-deploy ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Batasi agar hanya satu deployment yang berjalan dalam satu waktu
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Ganti ke 'pnpm' atau 'yarn' jika menggunakan package manager lain

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
